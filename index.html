<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#087e8b">

    <meta name="description"
          content="Hydro Reminder - تطبيق ذكي لتذكيرك بشرب الماء">

    <title>Hydro Reminder 💧</title>

    <link rel="manifest"
          href="manifest.json">

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

<header class="topbar">

    <div>

        <h1>Hydro Reminder 💧</h1>

        <p>
            حافظ على ترطيب جسمك
        </p>

    </div>


    <button id="themeBtn">
        🌙
    </button>

</header>


<main>


    <!-- بطاقة الماء -->

    <section class="water-card">


        <div class="progress">

            <svg viewBox="0 0 120 120">

                <circle
                    class="circle-bg"
                    cx="60"
                    cy="60"
                    r="52">
                </circle>


                <circle
                    id="progressCircle"
                    cx="60"
                    cy="60"
                    r="52">
                </circle>

            </svg>


            <div class="progress-text">

                <strong id="percentage">
                    0%
                </strong>

                <span>
                    من هدفك
                </span>

            </div>

        </div>


        <h2>

            <span id="currentWater">
                0
            </span>

            ml

        </h2>


        <p>

            من أصل

            <span id="goalWater">
                2000
            </span>

            ml

        </p>

    </section>



    <!-- إضافة الماء -->

    <section class="quick-add">

        <h2>
            إضافة الماء 💧
        </h2>


        <div class="buttons">


            <button data-amount="150">
                +150 ml
            </button>


            <button data-amount="250">
                +250 ml
            </button>


            <button data-amount="500">
                +500 ml
            </button>


        </div>

    </section>



    <!-- الإحصائيات -->

    <section class="stats">


        <div class="stat">

            <span>
                💧
            </span>

            <strong id="cups">
                0
            </strong>

            <small>
                كؤوس
            </small>

        </div>



        <div class="stat">

            <span>
                🎯
            </span>

            <strong id="remaining">
                2000
            </strong>

            <small>
                متبقي ml
            </small>

        </div>



        <div class="stat">

            <span>
                🔥
            </span>

            <strong id="streak">
                0
            </strong>

            <small>
                أيام متتالية
            </small>

        </div>


    </section>



    <!-- التذكير -->

    <section class="reminder-card">


        <div>

            <h2>
                ⏰ التذكير
            </h2>

            <p id="reminderStatus">
                التذكيرات متوقفة
            </p>

        </div>


        <button id="reminderBtn">
            تشغيل
        </button>


    </section>



    <!-- الإعدادات -->

    <section class="settings">

        <h2>
            ⚙️ الهدف اليومي
        </h2>


        <div class="goal-control">


            <button id="minusGoal">
                −
            </button>


            <strong>

                <span id="goalDisplay">
                    2000
                </span>

                ml

            </strong>


            <button id="plusGoal">
                +
            </button>


        </div>

    </section>


</main>



<footer>

    Hydro Reminder •
    اشرب الماء واهتم بصحتك 💙

</footer>



<script src="script.js"></script>



<!-- تشغيل Service Worker -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("./service-worker.js")

            .then(() => {

                console.log(
                    "Hydro Reminder: Service Worker registered"
                );

            })

            .catch(error => {

                console.error(
                    "Service Worker error:",
                    error
                );

            });

    });

}

</script>


</body>

</html>
